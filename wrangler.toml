name = "my-timetable"
main = "index.js"
compatibility_date = "2026-07-18"

# 飞书课前提醒的定时触发（UTC！北京时间 = UTC+8）
# 对应北京时间：07:55/09:55/17:55、13:15/15:15、19:45
# 改动上课时间或提醒提前量后需按"北京时间 - 8 小时"同步更新
[triggers]
crons = ["55 23,1,9 * * *", "15 5,7 * * *", "45 11 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "TIMETABLE_DB" #KV空间名
id = "local-dev-placeholder" # 本地开发占位 ID；部署前请换成 Cloudflare 控制台里的真实 KV Namespace ID